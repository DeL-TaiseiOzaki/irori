name: Verify and package desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its run. main's runs always finish: a release can
# publish from one, and cancelling it would leave a merged change without tested packages.
concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # The push can contain several commits. The release policy also needs its tags.
          fetch-depth: 0
      - if: github.event_name == 'push'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Choose checks for the exact checkout
        id: plan
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: bash .github/ci/plan.sh

  verify:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - name: Allow Chromium sandbox in the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run format:check
      - run: npm run build
      - run: npm test
      - run: npm run build:website
      - run: xvfb-run -a npm run test:website
      - if: github.event_name == 'pull_request'
        run: xvfb-run -a npx tsx scripts/ui-screens.ts hearth-ja dark-en light-ja
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-screenshots-${{ github.sha }}
          path: test-results/screens/*.png
          if-no-files-found: warn
          retention-days: 7

  ui:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - name: Allow Chromium sandbox in the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run build:app
      - name: Run this group of Electron UI smokes
        env:
          UI_GROUP: ${{ matrix.group }}
        run: xvfb-run -a npm run test:ui -- "$UI_GROUP"
      - if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ui-smoke-screenshots-${{ matrix.group }}-${{ github.sha }}
          path: test-results/*.png
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

  # Packaging does not wait for verify. A release still needs the whole run to succeed, so
  # nothing is published from packages whose source failed verification.
  package:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
          # The acceptance device runs macOS 26. An older runner accepted a package
          # that aborts at launch there, so the Mac job matches the shipped target.
          - os: macos-26
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - if: runner.os == 'Linux'
        name: Allow Chromium sandbox in the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - if: runner.os == 'Windows'
        name: Exercise Windows SSH and filesystem behavior
        run: node --import tsx --test tests/ssh-askpass.test.ts tests/note-operations.test.ts
      - run: npm run make -- --arch=${{ matrix.arch }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - if: runner.os != 'Linux'
        run: npm run test:package
      # The in-app update, applied to an installed copy with the platform's own tools:
      # Squirrel's Update.exe on Windows; hdiutil, ditto, codesign and open on the Mac.
      - if: runner.os != 'Linux'
        run: npm run test:update-package
      # Short-lived engineering artifacts, never GitHub Releases or website downloads.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: unsigned-irori-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            out/make/**
            test-results/package-smoke.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  result:
    name: Desktop CI
    if: ${{ always() }}
    needs: [plan, verify, ui, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    permissions: {}
    steps:
      - name: Require every planned check to pass
        env:
          PLAN: ${{ needs.plan.result }}
          MODE: ${{ needs.plan.outputs.mode }}
          VERIFY: ${{ needs.verify.result }}
          UI: ${{ needs.ui.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          case "$PLAN:$MODE:$VERIFY:$UI:$PACKAGE" in
            success:record-only:skipped:skipped:skipped|success:full:success:success:success) ;;
            *)
              printf '::error::Desktop CI did not pass (plan=%s, mode=%s, verify=%s, UI=%s, package=%s).\n' \
                "$PLAN" "$MODE" "$VERIFY" "$UI" "$PACKAGE"
              exit 1
              ;;
          esac
