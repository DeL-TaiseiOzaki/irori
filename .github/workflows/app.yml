name: Verify and package desktop

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - run: node scripts/prepare-rclone.mjs
      - name: Allow Chromium sandbox in the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run format:check
      - run: npm run build
      - run: npm test
        env:
          IRORI_TEST_RCLONE_PATH: ${{ github.workspace }}/.local/rclone/linux-x64/rclone
      - run: xvfb-run -a npm run test:ui
      - run: npm run build:website
      - run: xvfb-run -a npm run test:website

  package:
    needs: verify
    env:
      IRORI_EXPECT_PACKAGED_OAUTH: ${{ secrets.IRORI_GOOGLE_CLIENT_ID != '' && secrets.IRORI_GOOGLE_CLIENT_SECRET != '' && '1' || '0' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x64
          - os: windows-2025
            platform: win32
            arch: x64
          # The acceptance device runs macOS 26. An older runner accepted a package
          # that aborts at launch there, so the Mac job matches the shipped target.
          - os: macos-26
            platform: darwin
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          cache: npm
      - run: npm ci
      - run: npm run setup:electron
      - if: runner.os == 'Linux'
        name: Allow Chromium sandbox in the disposable runner
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm run make -- --arch=${{ matrix.arch }}
        env:
          IRORI_BUILD_GOOGLE_CLIENT_ID: ${{ secrets.IRORI_GOOGLE_CLIENT_ID }}
          IRORI_BUILD_GOOGLE_CLIENT_SECRET: ${{ secrets.IRORI_GOOGLE_CLIENT_SECRET }}
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:package
      - if: runner.os != 'Linux'
        run: npm run test:package
      # The in-app update, applied to an installed copy with the platform's own tools:
      # Squirrel's Update.exe on Windows; hdiutil, ditto, codesign and open on the Mac.
      - if: runner.os != 'Linux'
        run: npm run test:update-package
      # Short-lived engineering artifacts, never GitHub Releases or website downloads.
      - uses: actions/upload-artifact@v7
        with:
          name: unsigned-irori-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: |
            out/make/**
            test-results/package-smoke.json
          if-no-files-found: error
          retention-days: 7
