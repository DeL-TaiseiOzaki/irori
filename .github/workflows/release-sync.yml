name: Keep main and the preview in step

# main and the published preview stay in step (docs/DISTRIBUTION.md). A pull request that
# changes what ships must already carry the version and notes it will be published with,
# and main must not hold such a change unpublished for longer than the grace period.
# scripts/release-policy.ts decides what ships. This file is not part of that set, so
# changing it does not itself require a release.
on:
  pull_request:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pull-request:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          # The check compares against the merge base and the published preview tags.
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Require a version and release notes for a change that ships
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/release-policy.ts pr "$BASE" "$HEAD"

  drift:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
      - name: Compare main with the latest published preview
        id: drift
        run: node scripts/release-policy.ts drift origin/main --grace-minutes=60
      - name: Check that the latest release and the download page are whole
        if: always() && steps.drift.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.drift.outputs.tag }}
          SITE: https://del-taiseiozaki.github.io/irori/
        run: |
          set -euo pipefail
          version=${TAG#v}
          version=${version%%-*}
          assets=$(gh release view "$TAG" --json assets --jq '.assets[] | select(.state == "uploaded") | .name')
          for name in "irori-$version-windows-x64-Setup.exe" "irori-$version-macos-arm64.dmg" SHA256SUMS.txt; do
            grep -qxF "$name" <<<"$assets" || { echo "::error::$TAG has no uploaded $name"; exit 1; }
          done
          # The page bundles its manifest into a script, so look for the tag in what it loads.
          page=$(curl -fsSL --max-time 30 "$SITE")
          found=
          for script in $(grep -oE 'assets/[^"]+\.js' <<<"$page" | sort -u); do
            if curl -fsSL --max-time 30 "$SITE$script" | grep -qF "/releases/download/$TAG/"; then found=1; fi
          done
          [ -n "$found" ] || { echo "::error::The download website does not offer $TAG"; exit 1; }
          echo "$TAG has both installers and SHA256SUMS.txt, and the download website offers it." >> "$GITHUB_STEP_SUMMARY"
